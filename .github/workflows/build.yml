# Build the editor for Windows and macOS on every push, and keep one rolling
# `latest` release holding the newest of each.
#
# Two things are built: the synthesiser, which is C (the `engine` submodule),
# and the editor around it, which is Python packaged with PyInstaller. The
# builds carry VocalWriter 2.0.1's own data files, as this repository does --
# they are KAE Labs' work and not covered by our licence; see NOTICE.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # the rolling release is written by this workflow

# One build at a time: two pushes in quick succession would otherwise race to
# move the same tag, and the loser would publish the older commit.
concurrency:
  group: rolling-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # a broken macOS build should not hide Windows
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: VocalWriterStudio-win64
          - os: macos-14     # Apple Silicon
            label: macos
            asset: VocalWriterStudio-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true       # the synthesiser

      # The commit recorded here says which engine the editor was last tested
      # against; the build takes the newest one instead. The two repositories
      # move together and the checks below are what say whether they still
      # agree -- a recorded commit that someone forgot to move on would
      # otherwise ship an engine older than the editor calling into it.
      - name: The engine's latest
        shell: bash
        run: |
          # Fetch and check out, rather than `submodule update --remote
          # --merge`: the checkout above clones the submodule shallowly, and
          # merging a commit whose history does not reach into that shallow
          # window is refused outright ("unrelated histories").
          git -C engine fetch --depth 1 origin master
          git -C engine checkout --detach FETCH_HEAD
          echo "engine: $(git -C engine log -1 --format='%h %s')"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install what the build needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy cffi setuptools wxPython pyinstaller

      # The Windows runners carry MSYS2's mingw-w64 GCC but do not put it on
      # the path. Clang on macOS needs nothing.
      - name: Find a C compiler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in /c/msys64/mingw64/bin /c/msys64/ucrt64/bin /c/ProgramData/mingw64/mingw64/bin /c/mingw64/bin; do
            if [ -x "$d/gcc.exe" ]; then echo "$d" >> "$GITHUB_PATH"; echo "gcc: $d"; exit 0; fi
          done
          echo "no mingw gcc found; what is here:"; ls /c | head -40; exit 1

      - name: Build the synthesiser
        shell: bash
        run: |
          sh engine/build.sh
          ls -l engine/build/libvocalwriter.*

      # The whole program is that library: if it will not load there is
      # nothing to ship, and a build that packages anyway is worse than one
      # that stops here. So this makes every call the editor makes into the
      # engine, and an engine and an editor that no longer agree fail here
      # rather than in someone's hands -- the dictionary, the whole voice
      # bank, a wavetable voice at the level that keeps it inside full scale,
      # the reverb, and a phrase longer than the engine's first buffer.
      - name: The synthesiser must load and sing
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          from ppc import cengine
          from ppc.engine import Engine
          print(cengine.describe())
          assert cengine.available(), cengine.REASON
          eng = Engine()
          print(eng.ping())
          voices = eng.voices()
          print('%d voices: %s ...' % (len(voices), ', '.join(voices[:4])))
          assert len(voices) > 80, voices
          print('daisy:', eng.phonemes(['daisy']))
          assert eng.phonemes(['daisy'])['daisy']

          def part(**kw):
              base = {'program': 0, 'volume': 1.0, 'pan': 0.0, 'notes': [
                  {'pitch': 67, 'beats': 1.0, 'phonemes': ['d', 'EY']},
                  {'pitch': 65, 'beats': 1.0, 'phonemes': ['z', 'IY']}]}
              base.update(kw)
              return base

          res = eng.render({'bpm': 100, 'tracks': [part()]}, 'ci-plain.wav')
          print('plain: %.2f s' % res['seconds'])
          assert res['seconds'] > 1.0

          strings = voices.index('Strings')
          y, peak = eng._samples({'bpm': 100, 'reverb': {'room': 40, 'wet': 24},
                                  'tracks': [part(voice_id=strings, pan=-0.5)]})
          y = np.asarray(y)
          clipped = int((np.abs(np.rint(y * 32768)) >= 32760).sum())
          print('Strings with reverb: peak %.3f, %d samples clipped'
                % (float(np.abs(y).max()), clipped))
          assert clipped == 0, 'the wavetable voices are clipping again'
          assert y.ndim == 2, 'the reverb should have made it stereo'

          long_part = part(notes=[{'pitch': 60 + (i % 5), 'beats': 0.5,
                                   'phonemes': ['AA']} for i in range(160)])
          res = eng.render({'bpm': 120, 'tracks': [long_part]}, 'ci-long.wav')
          print('one phrase of 160 notes: %.1f s' % res['seconds'])
          assert res['seconds'] > 30, 'the output buffer stopped growing'
          PY

      - name: Package
        run: pyinstaller --noconfirm VocalWriterStudio.spec

      # The guide goes beside the program rather than inside it, so that
      # someone who unzips the folder can read it without running anything.
      # Each platform puts it where that platform's folder is: on macOS the
      # build makes both the collected folder and the .app, so choosing by
      # what exists picks the wrong one.
      - name: Zip it up (Windows)
        if: runner.os == 'Windows'
        run: |
          cp docs/USING.md "dist/VocalWriterStudio/Read Me.txt"
          cd dist
          7z a -tzip ${{ matrix.asset }}.zip VocalWriterStudio

      # ditto with the resource forks and the executable bit left alone, which
      # is why this is `ditto` and not `zip`
      - name: Zip it up (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          mkdir -p "VocalWriter Studio"
          mv "VocalWriter Studio.app" "VocalWriter Studio/"
          cp ../docs/USING.md "VocalWriter Studio/Read Me.txt"
          ditto -c -k --sequesterRsrc --keepParent "VocalWriter Studio" ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: rolling latest release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Move the rolling release to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes=$(mktemp)
          {
            printf 'Built from %s on %s.\n\n' \
              "$(git rev-parse --short HEAD)" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf '%s\n\n' "$(git log -1 --pretty=%s)"
            cat .github/rolling-release.md
          } > "$notes"
          # `gh release edit` cannot move a tag, so the release is replaced.
          # Deleting it takes the tag with it, and a fresh one is made against
          # this commit.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest builds/*.zip \
            --title "Latest build" \
            --notes-file "$notes" \
            --prerelease \
            --target "$GITHUB_SHA"
