# Build the editor for Windows and macOS on every push, and keep one rolling
# `latest` release holding the newest of each.
#
# The builds carry none of VocalWriter 2.0: its binary, dictionary and voice
# bank are KAE Labs' software and are not in this repository, so they cannot be
# in anything built from it. `ppc/paths.py` looks for an `assets` folder beside
# the executable, and the program says exactly what is missing on startup if it
# is not there.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # the rolling release is written by this workflow

# One build at a time: two pushes in quick succession would otherwise race to
# move the same tag, and the loser would publish the older commit.
concurrency:
  group: rolling-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # a broken macOS build should not hide Windows
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: VocalWriterStudio-win64
          - os: macos-14     # Apple Silicon
            label: macos
            asset: VocalWriterStudio-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install what the build needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy cffi setuptools wxPython pyinstaller

      - name: Compile the core
        run: python -m ppc.build_core

      # The compiled core is the difference between a render taking a minute
      # and taking an hour, and when it fails to import everything falls back
      # to the Python interpreter silently. Fail the build instead.
      - name: The core must actually load
        run: |
          python -c "from ppc import fastcpu; d = fastcpu.describe(); print(d); assert d.startswith('compiled'), d"

      - name: Package
        run: pyinstaller --noconfirm VocalWriterStudio.spec

      - name: Zip it up (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a -tzip ${{ matrix.asset }}.zip VocalWriterStudio

      # ditto with the resource forks and the executable bit left alone, which
      # is why this is `ditto` and not `zip`
      - name: Zip it up (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "VocalWriter Studio.app" ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: rolling latest release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Move the rolling release to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes=$(mktemp)
          {
            printf 'Built from %s on %s.\n\n' \
              "$(git rev-parse --short HEAD)" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf '%s\n\n' "$(git log -1 --pretty=%s)"
            cat .github/rolling-release.md
          } > "$notes"
          # `gh release edit` cannot move a tag, so the release is replaced.
          # Deleting it takes the tag with it, and a fresh one is made against
          # this commit.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest builds/*.zip \
            --title "Latest build" \
            --notes-file "$notes" \
            --prerelease \
            --target "$GITHUB_SHA"
