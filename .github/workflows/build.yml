# Build the editor for Windows and macOS on every push, and keep one rolling
# `latest` release holding the newest of each.
#
# Two things are built: the synthesiser, which is C (the `engine` submodule),
# and the editor around it, which is Python packaged with PyInstaller. The
# builds carry VocalWriter 2.0.1's own data files, as this repository does --
# they are KAE Labs' work and not covered by our licence; see NOTICE.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # the rolling release is written by this workflow

# One build at a time: two pushes in quick succession would otherwise race to
# move the same tag, and the loser would publish the older commit.
concurrency:
  group: rolling-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # a broken macOS build should not hide Windows
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: VocalWriterStudio-win64
          - os: macos-14     # Apple Silicon
            label: macos
            asset: VocalWriterStudio-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true       # the synthesiser

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install what the build needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy cffi setuptools wxPython pyinstaller

      # The Windows runners carry MSYS2's mingw-w64 GCC but do not put it on
      # the path. Clang on macOS needs nothing.
      - name: Find a C compiler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in /c/msys64/mingw64/bin /c/msys64/ucrt64/bin /c/ProgramData/mingw64/mingw64/bin /c/mingw64/bin; do
            if [ -x "$d/gcc.exe" ]; then echo "$d" >> "$GITHUB_PATH"; echo "gcc: $d"; exit 0; fi
          done
          echo "no mingw gcc found; what is here:"; ls /c | head -40; exit 1

      - name: Build the synthesiser
        shell: bash
        run: |
          sh engine/build.sh
          ls -l engine/build/libvocalwriter.*

      # The whole program is that library. If it will not load there is
      # nothing to ship, and a build that packages anyway is worse than one
      # that stops here.
      - name: The synthesiser must load and sing
        shell: bash
        run: |
          python - <<'PY'
          from ppc import cengine, render
          from ppc.engine import Engine
          print(cengine.describe())
          assert cengine.available(), cengine.REASON
          eng = Engine()
          print(eng.ping())
          print('voices:', ', '.join(eng.voices()[:4]))
          print('daisy:', eng.phonemes(['daisy']))
          song = {'bpm': 100, 'tracks': [{'program': 0, 'volume': 1.0,
                  'pan': 0.0, 'notes': [
                      {'pitch': 67, 'beats': 1.0, 'phonemes': ['d', 'EY']},
                      {'pitch': 65, 'beats': 1.0, 'phonemes': ['z', 'IY']}]}]}
          res = eng.render(song, 'ci-check.wav')
          print('rendered %.2f s' % res['seconds'])
          assert res['seconds'] > 1.0
          PY

      - name: Package
        run: pyinstaller --noconfirm VocalWriterStudio.spec

      - name: Zip it up (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a -tzip ${{ matrix.asset }}.zip VocalWriterStudio

      # ditto with the resource forks and the executable bit left alone, which
      # is why this is `ditto` and not `zip`
      - name: Zip it up (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "VocalWriter Studio.app" ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: rolling latest release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Move the rolling release to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes=$(mktemp)
          {
            printf 'Built from %s on %s.\n\n' \
              "$(git rev-parse --short HEAD)" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf '%s\n\n' "$(git log -1 --pretty=%s)"
            cat .github/rolling-release.md
          } > "$notes"
          # `gh release edit` cannot move a tag, so the release is replaced.
          # Deleting it takes the tag with it, and a fresh one is made against
          # this commit.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest builds/*.zip \
            --title "Latest build" \
            --notes-file "$notes" \
            --prerelease \
            --target "$GITHUB_SHA"
